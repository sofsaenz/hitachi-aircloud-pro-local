# Example Lovelace view showing every indoor unit plus the outdoor unit.
# Paste into a dashboard in "Raw configuration editor", or add the cards one by one.
title: Aire acondicionado
views:
  - title: HVAC
    path: hvac
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: thermostat
            entity: climate.cuarto_servicio
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.oficina
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.cuarto_ninas
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.sala
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.cuarto_visitas
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.game_room
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.cinema
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
          - type: thermostat
            entity: climate.main_bedroom
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, cool, heat, dry, fan_only]
      - type: entities
        title: Unidad exterior (RAS-100HNCERW)
        entities:
          - sensor.outdoor_unit_odu_000_outdoor_temperature
          - sensor.outdoor_unit_odu_000_compressor_frequency
          - sensor.outdoor_unit_odu_000_cycle
          - binary_sensor.outdoor_unit_odu_000_alarm
      - type: glance
        title: Temperatura por habitación
        entities:
          - sensor.cuarto_servicio_room_temperature
          - sensor.oficina_room_temperature
          - sensor.cuarto_ninas_room_temperature
          - sensor.sala_room_temperature
          - sensor.cuarto_visitas_room_temperature
          - sensor.game_room_room_temperature
          - sensor.cinema_room_temperature
          - sensor.main_bedroom_room_temperature
